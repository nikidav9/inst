# Файл собран scripts/make-inst-ci.py из .github/workflows/secret-scan.yml — не править руками.
# Лежит в публичном nikidav9/inst (минуты закрытого Jobbbrbeb кончились, 18.11.2026).
# Нужен секрет SRC_READ_TOKEN — как у ci.yml. Запуск вместе с ci.yml: строка в ci-now.
name: Secret scan

# Токены и ключи не должны попасть в публичный репозиторий (03.10.2026: токен
# телеграм-бота из старой истории git, реклама VPN в описании бота). Смотрим
# только строки, добавленные PR: scripts/secret-scan.py. Значение не печатается.
on:
  push:
    paths: [ci-now]   # запуск строкой в ci-now вместе с ci.yml; сообщение коммита «ci: ветка [база]»
  workflow_dispatch:
    inputs:
      ref:
        description: ветка или коммит закрытого репозитория (по умолчанию main)
        default: main
      base:
        description: коммит, с которым сравнить (пусто — всё целиком)
        default: ''
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest # 12.11.2026: проверки вынесены с боевого сервера (решение владельца), вернуть — [self-hosted, selectel-ci]
    steps:
      # Рабочая папка на сервере сборки общая для всех заданий. 20.10.2026 задание
      # рассылки оставило в ней sparse-checkout, и следующие checkout получали не
      # весь код («package-lock.json не найден»). Чиним до checkout.
      - name: Рабочая папка целиком
        run: |
          # Сам checkout sparse-checkout выключает, но пометки skip-worktree в
          # индексе остаются, и файлы не возвращаются. Нашли такие — папку
          # очищаем целиком, checkout скачает чистую копию.
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || git ls-files -v 2>/dev/null | grep -q '^S' \
             || [ -n "$(git ls-files --deleted 2>/dev/null | head -1)" ]; then
            echo "Рабочая папка неполная — очищаю"
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          fi
      - name: Код закрытого репозитория (токен только на чтение)
        working-directory: .   # у задания Dashboard рабочая папка dashboard, её ещё нет
        env:
          SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Запуск пушем строки в ci-now: сообщение коммита «ci: <ветка> [<с чем сравнить>]».
          SRC_REF="${IN_REF:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *\([^ ]*\).*/\1/p')}"; SRC_REF="${SRC_REF:-main}"
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          git init -q .
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)"
          git -c http.extraheader="$hdr" fetch -q --depth=300 https://github.com/nikidav9/Jobbbrbeb.git "$SRC_REF" ${SRC_BASE:+"$SRC_BASE"}
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='commit %h'

      - name: Секреты в добавленных строках (или во всём дереве, если базы нет)
        env:
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          if [ -n "$SRC_BASE" ] && git merge-base "$SRC_BASE" HEAD >/dev/null 2>&1; then
            python3 scripts/secret-scan.py --base "$SRC_BASE"
          else
            python3 scripts/secret-scan.py --all
          fi
