      - name: Web build
        if: needs.changes.outputs.build == 'true'
        env:
          # Свой TMPDIR на задание: на своём исполнителе кэш Metro (os.tmpdir()/metro-cache)
          # общий для всех заданий, и боевая сборка брала из него код с заглушкой
          # example.invalid из CI — сайт и OTA остались без сервера (05.10.2026).
          TMPDIR: ${{ runner.temp }}
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          EXPO_PUBLIC_DASHBOARD_URL: https://example.invalid
        run: npx expo export --platform web --max-workers 2

      - name: Policy сверена со сборкой (хэши инлайн-скриптов в CSP)
        if: needs.changes.outputs.build == 'true'
        run: node scripts/check-csp.mjs

      - name: Вес картинок (WebP, лимиты в scripts/check-image-weight.mjs)
        run: node scripts/check-image-weight.mjs

      - name: Verify complete app shell
        if: needs.changes.outputs.build == 'true'
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('src', 'href'):
                      value = values.get(key, '')
                      if value.startswith('/_expo/static/') or value.startswith('/assets/'):
                          self.urls.append(urlparse(value).path.lstrip('/'))

          root = Path('dist')
          html = (root / 'index.html').read_text()
          parser = Assets()
          parser.feed(html)
          missing = [url for url in parser.urls if not (root / url).is_file()]
          if not parser.urls:
              raise SystemExit('index.html has no app assets')
          if missing:
              raise SystemExit('missing app assets: ' + ', '.join(missing))
          print(f'complete shell: {len(parser.urls)} referenced assets')
          PY

  # Браузерный движок Юпитера (решение владельца 28.09.2026): Chromium через
  # Python-Playwright. Отдельная задача — основной Юпитер остаётся на stdlib,
  # а браузер ставится только здесь. Версия закреплена.
  jupiter-browser:
    name: Jupiter browser engine
    needs: changes
    if: needs.changes.outputs.jupiter == 'true'
    runs-on: ubuntu-latest # 12.11.2026: проверки вынесены с боевого сервера (решение владельца), вернуть — [self-hosted, selectel-ci]
    timeout-minutes: 15
    steps:
      - name: Код закрытого репозитория (токен только на чтение)
        working-directory: .   # у задания Dashboard рабочая папка dashboard, её ещё нет
        env:
          SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Запуск пушем строки в ci-now: сообщение коммита «ci: <ветка> [<с чем сравнить>]».
          SRC_REF="${IN_REF:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *\([^ ]*\).*/\1/p')}"; SRC_REF="${SRC_REF:-main}"
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          git init -q .
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)"
          git -c http.extraheader="$hdr" fetch -q --depth=300 https://github.com/nikidav9/Jobbbrbeb.git "$SRC_REF" ${SRC_BASE:+"$SRC_BASE"}
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='commit %h'
      # Python — тот, что стоит на сервере сборки, как у основной задачи: скачивание
      # actions/setup-python с GitHub обрывалось по таймауту и роняло задачу до
      # первого теста (19.10.2026).
      - name: Install Playwright + Chromium
        run: |
          python3 --version
          pip install playwright==1.63.0
          python3 -m playwright install chromium
      - name: Browser engine on a synthetic heavy career site
        env:
          JUPITER_BROWSER_TESTS: '1'
        run: |
          cd jupiter
          for t in test_browser_engine test_browser_frames test_browser_planner test_browser_success \
                   test_browser_sessions test_browser_overlays test_browser_captcha \
                   test_browser_custom_controls test_browser_guard test_recon_browser test_browser_zoo \
                   test_browser_engine_captcha test_alice_dom test_alice_agent; do
            echo "== $t"; python3 $t.py
          done

  dashboard:
    name: Dashboard build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest # 12.11.2026: проверки вынесены с боевого сервера (решение владельца), вернуть — [self-hosted, selectel-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Код закрытого репозитория (токен только на чтение)
        working-directory: .   # у задания Dashboard рабочая папка dashboard, её ещё нет
        env:
          SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Запуск пушем строки в ci-now: сообщение коммита «ci: <ветка> [<с чем сравнить>]».
          SRC_REF="${IN_REF:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *\([^ ]*\).*/\1/p')}"; SRC_REF="${SRC_REF:-main}"
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          git init -q .
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)"
          git -c http.extraheader="$hdr" fetch -q --depth=300 https://github.com/nikidav9/Jobbbrbeb.git "$SRC_REF" ${SRC_BASE:+"$SRC_BASE"}
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='commit %h'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: npm run build
