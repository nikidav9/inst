# Файл собран scripts/make-inst-ci.py из .github/workflows/ci.yml — не править руками.
# Лежит в публичном nikidav9/inst (минуты закрытого Jobbbrbeb кончились, 18.11.2026).
# Нужен секрет SRC_READ_TOKEN — fine-grained токен только Contents: read на Jobbbrbeb.
name: CI

# Только на PR (решение владельца 06.10.2026): после мержа тот же код
# проверялся второй раз и держал оба исполнителя VPS ~30 минут — выкат
# сайта стоял за ним в очереди. Мерж — только при зелёном CI на PR.
# На PR тяжёлое гоняется по участкам (задание changes); ночью — всё целиком,
# чтобы правка одного участка, сломавшая другой, всплыла до утра.
on:
  push:
    paths: [ci-now]   # запуск строкой в ci-now; сообщение коммита «ci: ветка [база]»
  workflow_dispatch:
    inputs:
      ref:
        description: ветка или коммит закрытого репозитория (по умолчанию main)
        default: main
      base:
        description: коммит, с которым сравнить (пусто — гнать всё целиком)
        default: ''
  schedule:
    - cron: '17 23 * * *'   # 02:17 МСК, полный прогон main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Какие тяжёлые части нужны этому PR (решения владельца 06.10.2026):
  # движок Юпитера (~10 мин), тесты Юпитера (~6 мин), сборка сайта и
  # приложения (~3 мин) и сборка панели гоняются, только если менялся их
  # участок или сам CI. Быстрое (lint, typecheck, PHP-тесты) — всегда.
  # Ручной и ночной запуск — всё.
  changes:
    name: What changed
    runs-on: ubuntu-latest # 12.11.2026: проверки вынесены с боевого сервера (решение владельца), вернуть — [self-hosted, selectel-ci]
    # 11.11.2026: было 3 минуты. checkout с fetch-depth 0 тянет историю всех веток (их 300+),
    # и на загруженной машине сборки не укладывался в лимит: проверка отменялась, а за ней
    # пропускались все остальные.
    timeout-minutes: 10
    outputs:
      jupiter: ${{ steps.diff.outputs.jupiter }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
      jupiter_tests: ${{ steps.diff.outputs.jupiter_tests }}
      build: ${{ steps.diff.outputs.build }}
    steps:
      # Рабочая папка на сервере сборки общая для всех заданий. 20.10.2026 задание
      # рассылки оставило в ней sparse-checkout, и следующие checkout получали не
      # весь код («package-lock.json не найден»). Чиним до checkout.
      - name: Рабочая папка целиком
        run: |
          # Сам checkout sparse-checkout выключает, но пометки skip-worktree в
          # индексе остаются, и файлы не возвращаются. Нашли такие — папку
          # очищаем целиком, checkout скачает чистую копию.
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || git ls-files -v 2>/dev/null | grep -q '^S' \
             || [ -n "$(git ls-files --deleted 2>/dev/null | head -1)" ]; then
            echo "Рабочая папка неполная — очищаю"
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          fi
      - name: Код закрытого репозитория (токен только на чтение)
        working-directory: .   # у задания Dashboard рабочая папка dashboard, её ещё нет
        env:
          SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Запуск пушем строки в ci-now: сообщение коммита «ci: <ветка> [<с чем сравнить>]».
          SRC_REF="${IN_REF:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *\([^ ]*\).*/\1/p')}"; SRC_REF="${SRC_REF:-main}"
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          git init -q .
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)"
          git -c http.extraheader="$hdr" fetch -q --depth=300 https://github.com/nikidav9/Jobbbrbeb.git "$SRC_REF" ${SRC_BASE:+"$SRC_BASE"}
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='commit %h'
      - id: diff
        env:
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          if [ -z "$BASE" ]; then
            for k in jupiter dashboard jupiter_tests build; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          # quotepath=off: иначе русское имя файла (docs/очередь-задач.md) приходит
          # в кавычках восьмеричными кодами, не совпадает ни с одним участком и
          # запускает сборку зря (06.10.2026).
          files=$(git -c core.quotepath=off diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          echo "jupiter=$(has '^(jupiter/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "dashboard=$(has '^(dashboard/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "jupiter_tests=$(has '^(jupiter/|infra/|tests/(jupiter|recon)_[^/]*\.py$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          # Сборка — если хоть один файл не из списка «в сборку не входит»:
          # незнакомый путь собирает, а не пропускает.
          nobuild='^(php-proxy/|supabase/|jupiter/|dashboard/|docs/|\.claude/|video/|tests/api_smoke/|tests/phpstan/|phpstan[^/]*\.neon$|tests/[^/]*\.(php|py|sh)$|[^/]*\.md$)'
          echo "build=$(printf '%s\n' "$files" | grep -vqE "$nobuild" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  app:
    name: App, tests and web build
    needs: changes
    runs-on: ubuntu-latest # 12.11.2026: проверки вынесены с боевого сервера (решение владельца), вернуть — [self-hosted, selectel-ci]
    timeout-minutes: 20
    steps:
      # Рабочая папка на сервере сборки общая для всех заданий. 20.10.2026 задание
      # рассылки оставило в ней sparse-checkout, и следующие checkout получали не
      # весь код («package-lock.json не найден»). Чиним до checkout.
      - name: Рабочая папка целиком
        run: |
          # Сам checkout sparse-checkout выключает, но пометки skip-worktree в
          # индексе остаются, и файлы не возвращаются. Нашли такие — папку
          # очищаем целиком, checkout скачает чистую копию.
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || git ls-files -v 2>/dev/null | grep -q '^S' \
             || [ -n "$(git ls-files --deleted 2>/dev/null | head -1)" ]; then
            echo "Рабочая папка неполная — очищаю"
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          fi
      - name: Код закрытого репозитория (токен только на чтение)
        working-directory: .   # у задания Dashboard рабочая папка dashboard, её ещё нет
        env:
          SRC_TOKEN: ${{ secrets.SRC_READ_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          IN_BASE: ${{ inputs.base }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # Запуск пушем строки в ci-now: сообщение коммита «ci: <ветка> [<с чем сравнить>]».
          SRC_REF="${IN_REF:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *\([^ ]*\).*/\1/p')}"; SRC_REF="${SRC_REF:-main}"
          SRC_BASE="${IN_BASE:-$(printf '%s' "$MSG" | sed -n '1s/^ci: *[^ ]* *\([^ ]*\).*/\1/p')}"
          git init -q .
          hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64 -w0)"
          git -c http.extraheader="$hdr" fetch -q --depth=300 https://github.com/nikidav9/Jobbbrbeb.git "$SRC_REF" ${SRC_BASE:+"$SRC_BASE"}
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='commit %h'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PHP syntax
        run: find php-proxy -name '*.php' -print0 | xargs -0 -n1 php -l

      # Класс ошибок «вызов ↔ сигнатура» (PR #876: frc_key(array $sections) получал null из db.php → HTTP 500 на всей
      # ленте), который тесты модулей по отдельности не видят. Три слоя: быстрый сторож по тексту (секунды), PHPStan
      # (≈1 мин, падает только на новые замечания сверх phpstan-baseline.neon) и дымовые проверки настоящего db.php.
      - name: Вызов ↔ сигнатура PHP — число аргументов, неопределённые функции, null в параметр без «?»
        run: |
          php tests/php_call_signature_test.php --self-test
          php tests/php_call_signature_test.php

      - name: Кэш PHPStan
        uses: actions/cache@v4
        with:
          path: .phpstan-cache
          key: phpstan-2.1.17-${{ github.sha }}
          restore-keys: phpstan-2.1.17-

      # Версия закреплена и сверена по sha256 (phar с github.com/phpstan/phpstan/releases; в package.json не входит).
      # Локально то же: tests/phpstan.sh. Базовый файл пересоздаётся: tests/phpstan.sh --baseline.
      - name: PHPStan — аргументы функций и типы (php-proxy, уровень 5 + checkNullables, только новые замечания)
        run: |
          curl -fsSL --retry 3 -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.17/phpstan.phar
          echo "767edc1d6a596308c9bdd1fa7e42bf27c88ce3772b8e527cba87dc1c19bd1c3b  /tmp/phpstan.phar" | sha256sum -c -
          php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon --no-progress --memory-limit=2G

      - name: Настройки PHPStan не потеряли главное (версия, контрольная сумма, checkNullables)
        run: python3 tests/phpstan_config_test.py

      # Настоящий php-proxy/db.php под `php -S` + заглушка PostgREST/хранилища/SMTP (tests/api_smoke/, только stdlib).
      # ≈1 мин. Локально: python3 tests/api_smoke_test.py [feed|profile|cancel|auth|perms].
      - name: Дымовые проверки API — настоящий db.php, заглушка базы, почты и хранилища
        run: python3 tests/api_smoke_test.py


      - name: Страница вакансии отдаёт содержимое и разметку
        run: php tests/vacancy_page_test.php

      - name: Адреса вакансий — транслит, slug и короткий id
        run: php tests/vacancy_slug_test.php

      - name: Сводные страницы считают, а не выдумывают
        run: php tests/landing_page_test.php

      - name: Страницы компаний, метро и стран — с порогом и в карте сайта
        run: php tests/seo_pages_test.php

      - name: Блок прямого ответа «Коротко» (AEO) — длина, числа из данных, speakable, малые выборки
        run: php tests/seo_answer_test.php

      - name: Главная и /companies для робота без JS — H1, текст, 20 вакансий, приложение не тронуто
        run: php tests/home_ssr_test.php
      - name: Страница компании /companies/слаг — слаг, факты, разметка
        run: php tests/company_pages_test.php

      - name: Зарплаты /zarplaty — порог 10, квартили, тексты, разметка, карта сайта
        run: php tests/zarplaty_test.php

      - name: Карта сайта не собирается заново на каждый запрос
        run: php tests/sitemap_cache_test.php
      - name: Индекс и части карты сайта
        run: php tests/sitemap_index_test.php

      - name: Приглашение платит за выход на смену, а не за отклик
        run: php tests/referral_test.php



      - name: Скрытые возраст и номер не уходят работодателю, файл сертификата — только владельцу
        run: php tests/profile_privacy_test.php

      - name: Удаление аккаунта кодом — только своя почта и свой аккаунт
        run: php tests/delete_by_code_test.php


      - name: Вход по почте — коды, квитанции, письмо доходит до SMTP
        run: php tests/auth_email_test.php

      - name: Окно «Войти или зарегистрироваться» — одинаковые ответы для известной и неизвестной почты
        run: php tests/auth_entry_test.php

      - name: Вход через Яндекс ID — три исхода, билет, секрет только на сервере
        run: php tests/auth_yandex_test.php

      - name: Отклик на сайте компании — в «Откликах», не в «Избранном»
        run: php tests/site_apply_test.php

      - name: Telegram-каналы — разбор t.me/s, контакт, фильтр, выключение плохого канала
        run: php tests/telegram_source_test.php

      - name: Telegram-каналы — зарубежный пост из ru-канала, название компании
        run: |
          php tests/telegram_abroad_test.php
          php tests/telegram_company_test.php
          php tests/telegram_push_test.php

      - name: Отклик по контакту и страница резюме /r/ — текст, адреса, срок, поля
        run: |
          php tests/contact_apply_test.php
          php tests/telegram_written_test.php
          php tests/ju_week_stats_test.php

      - name: Выход гасит сессию, «выйти везде» гасит все
        run: php tests/session_revoke_test.php

      - name: Согласие на обработку данных пишется и его пропажу видно
        run: php tests/consent_test.php

      - name: Согласие на рекламную рассылку — отдельное, отзываемое, только о себе
        run: php tests/marketing_consent_test.php

      - name: Письмо «3 дня Pro бесплатно» — только согласившимся, один раз, отписка отзывает согласие
        run: php tests/promo_mail_test.php

      - name: Почтовая рассылка из дашборда — только согласившимся, повтор не шлёт дважды, отписка
        run: php tests/marketing_mail_test.php

      - name: nginx — регулярки с {n} в кавычках (иначе nginx -t падает и сайт недоступен)
        run: python3 tests/nginx_regex_quotes_test.py

      - name: Подборка вакансий раз в неделю — только с согласием, 4 без возврата — стоп, отписка
        run: php tests/weekly_mail_test.php

      - name: Версия приложения в запросе — устаревшей сборке отказ, остальным нет
        run: php tests/app_version_test.php

      - name: Работодателей не регистрируем — письмо в поддержку, живое число компаний на сайте
        run: php tests/employer_closed_test.php




      - name: Заявки Jupiter — свои свои, воркер не подменяет чужое
        run: php tests/jupiter_applications_test.php

      - name: Отмена неотправленного отклика и удаление записи — отправленное не отзывается, воркер не пишет поверх
        run: php tests/jupiter_cancel_test.php

      - name: Поручение на автоотклик Юпитера включается документами, отзыв настоящий
        run: php tests/jupiter_live_consent_test.php

      - name: Экран «Ждут вас» получает своё выбранное резюме
        run: php tests/jupiter_fill_resume_test.php

      - name: Почта JobToo — читаемый адрес, повтор получает цифру
        run: php tests/jupiter_mail_address_test.php

      - name: Капча человеку — права, срок, длина ответа, чужая заявка
        run: php tests/jupiter_captcha_test.php

      - name: Вопросы от работодателей — права, банк ответов, возврат отклика в очередь
        run: php tests/jupiter_questions_test.php

      - name: Отклик письмом — домен вакансии, разрешение, вложение, Reply-To
        run: php tests/jupiter_email_apply_test.php

      - name: Логотипы компаний — WebP/PNG 256×256, права, имя файла по содержимому
        run: php tests/company_logos_db_test.php

      - name: Публичные страницы компаний и зарплат — функции открыты, зарубежные не входят, пустая ячейка не выдумывается
        run: php tests/public_pages_test.php

      - name: Молнии на сервере — 20 откликов за московские сутки на всех устройствах
        run: php tests/energy_server_test.php

      - name: YandexGPT подсказывает автопилоту поля — без данных человека, только ключи из списка
        run: php tests/jupiter_field_hints_test.php

      - name: Ключ YandexGPT из дашборда — сильнее GitHub, наружу только маска, непринятый Яндексом не сохраняется
        run: php tests/ygpt_dashboard_test.php

      - name: Выбор нейросети — Яндекс или Claude одной функцией, ключи только маской, без ключа Claude работает Яндекс
        run: php tests/ai_provider_test.php

      - name: Pro —Юпитер улучшает резюме и пишет письмо без выдуманных цифр, только своё и только с Pro
        run: php tests/pro_ai_test.php

      - name: Рамки Джу — только про работу, нейросеть и инструкции не раскрываются
        run: php tests/ju_guard_test.php

      - name: Джу не обещает ATS, не спамит ключевиками, не выдумывает навыки и цифры
        run: php tests/pro_safety_test.php

      - name: Английское резюме для англоязычных вакансий — имя кодом, без особых категорий в нейросети, перевод без лишнего и выдуманных цифр
        run: php tests/resume_en_test.php

      - name: Память Джу — факты только с источником, особые категории не пишутся, только свои
        run: php tests/career_memory_test.php

      - name: Профиль вакансии — разбор без ИИ, хэш стабилен, пишутся только изменившиеся
        run: php tests/vacancy_profile_test.php

      - name: «Что дальше?» — исход ставит только владелец и только у отправленного отклика
        run: php tests/jupiter_outcome_test.php
      - name: Источник исхода — исхода без источника не бывает, выведенных исходов нет
        run: php tests/outcome_provenance_test.php
      - name: «Есть новости?» — окно 7/14/60 дней, «пока неизвестно» не исход
        run: php tests/outcome_checkin_test.php

      - name: Сообщение рекрутера — связь только однозначная, текст не хранится, без отправки
        run: php tests/recruiter_message_test.php

      - name: Интервью — только при подтверждённом interview, отзыв не исход
        run: php tests/interview_mode_test.php

      - name: Тренировка интервью — без оценок, ответ не хранится
        run: php tests/mock_interview_test.php

      - name: Офферы — только при подтверждённом «Оффер», сравнение без баллов
        run: php tests/offers_test.php

      - name: Переговоры — без выдуманного «другого оффера», только «Скопировать»
        run: php tests/negotiate_test.php

      - name: Личная аналитика — только с источником, малые выборки без выводов
        run: php tests/ju_analytics_test.php

      - name: Эксперименты — одна переменная, согласие, итог с n
        run: php tests/ju_experiments_test.php

      - name: Оптимизатор — только предложение через «Подтвердить»
        run: php tests/ju_optimizer_test.php

      - name: Межпользовательская аналитика — выключена, k-анонимность, ничего не читает
        run: php tests/ju_cohort_test.php

      - name: Real match — профиль и личный сигнал отдельно, без чисел
        run: php tests/real_match_test.php

      - name: Карьерный путь — уровень из цели, пробелы с источником
        run: php tests/career_path_test.php

      - name: Рыночная стоимость — вилки только с n, без диапазона на малой выборке
        run: php tests/market_value_test.php

      - name: Copilot — только pending через «Подтвердить», ИИ привязан к тексту
        run: php tests/ju_copilot_test.php

      - name: Понимание ответов знакомства — правила раньше ИИ, без особых категорий, предел 20, только Pro
        run: php tests/ju_understand_test.php

