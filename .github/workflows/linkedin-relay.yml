# Копия для открытого репозитория nikidav9/inst: .github/workflows/linkedin-relay.yml,
# рядом в корне inst — копия infra/linkedin-worker.py (ноябрь 2026).
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 12.11.2026: с московского сервера LinkedIn не открывается (сброс соединения),
# поэтому тот же сборщик (гостевой поиск, только поля вакансии, честный User-Agent, ≤ 12 запросов
# за запуск с паузой 8-12 с, остановка на первой блокировке) запускается здесь, на адресе GitHub вне России,
# и присылает готовый фид на jobtoo.ru (ingest.php?kind=linkedin_relay). Блокировку LinkedIn
# обходить нельзя: если и этот адрес закрыт, запуск завершается красным, а не молча зелёным.
#
# Каждые 3 часа (8 запусков в сутки): список из 96 страниц поиска делится на 8 кусков по 12 страниц, запуск берёт
# свой кусок по часу UTC (российские и зарубежные поиски чередуются), за сутки проходит весь список, ~96 запросов.
# Сервер копит вакансии 30 дней с последнего появления (php-proxy/linkedin_relay.php).
#
# Секрет RELAY_KEY в inst — общий ключ присылки (как у career-relay). Запуск: по расписанию (каждые 3 часа),
# вручную и по push строки в файл linkedin-relay-now.
name: LinkedIn для jobtoo.ru

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['linkedin-worker.py', '.github/workflows/linkedin-relay.yml', 'linkedin-relay-now']

permissions:
  contents: read

concurrency:
  group: linkedin-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Собрать вакансии LinkedIn и прислать на сервер
        shell: bash
        env:
          LINKEDIN_RELAY_URL: https://jobtoo.ru/api/ingest.php?kind=linkedin_relay
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python3 linkedin-worker.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: Запустить приём фида на сайте (вакансии в базу и ленту)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          # 12.11.2026: фид лежал на сайте, но источник `linkedin` не звал никто (career-ingest ходит только за
          # career_owner, telegram-ingest только за каналами), и в ленте было 0 вакансий LinkedIn.
          KEY=$(printf %s "$RELAY_KEY" | tr -d '\r\n')
          [ -n "$KEY" ] || { echo "RELAY_KEY не задан в секретах inst"; exit 1; }
          URL="https://jobtoo.ru/api/ingest.php?source=linkedin&force=1"
          for attempt in 1 2 3 4 5 6; do
            RESP=$(curl -fsS "$URL" -H "X-Relay-Key: $KEY" --max-time 300) || RESP=''
            echo "Вызов $attempt: ${RESP:0:400}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -z "$RESP" ]; then sleep 20; continue; fi
            if echo "$RESP" | grep -q '"продолжение'; then sleep 10; continue; fi
            if echo "$RESP" | grep -q '"status":"ошибка'; then echo "Приём вернул ошибку"; exit 1; fi
            exit 0
          done
          echo "Приём не завершился за 6 вызовов"; exit 1
